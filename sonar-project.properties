sonar.projectKey=porteken_wetbulb-app
sonar.organization=porteken

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,e2e/**

sonar.exclusions=src/components/ui/**,src/lib/utils.ts,src/app/shadcn-tailwind.css,pnpm-lock.yaml

sonar.coverage.exclusions=**/__tests__/**,**/*.test.*,src/components/ui/**,src/components/modal.tsx,src/config/**,src/instrumentation-client.ts,src/instrumentation.ts,src/proxy.ts,src/testing/**,**/*types.ts,**/*.d.ts,**/index.ts,tests/**,e2e/**,next.config.ts,playwright.config.ts,postcss.config.mjs,sentry.edge.config.ts,sentry.server.config.ts,vitest.config.ts,vitest.setup.ts

sonar.cpd.exclusions=src/testing/**,**/*.test.*,**/__tests__/**,e2e/**

sonar.typescript.tsconfigPaths=tsconfig.json

sonar.qualitygate.wait=true